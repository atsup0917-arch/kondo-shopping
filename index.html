<label>新しい商品</label><input id="newProduct" placeholder="例：玉子"/><label>価格の種類</label><select id="newProductPriceMode"><option value="pack">商品単価</option><option value="gram">g単価</option></select><label>価格</label><input id="newProductPrice" inputmode="decimal" min="0" placeholder="例：175" step="0.01" type="number"/><label>商品写真</label><div class="productRegUpload"><label aria-label="写真を選択" class="productRegUploadLabel" for="newProductPhoto" title="写真を選択">📷</label><input accept="image/*,.heic,.heif,.jpg,.jpeg,.png,.webp" id="newProductPhoto" type="file"/><span class="small" style="margin:0">写真を選択</span></div><div class="productRegPhotoPreview" hidden="" id="newProductPhotoPreview"><img alt="商品写真" id="newProductPhotoImg"/></div><div class="small">登録した価格・写真は、買い物リストにも自動反映されます。</div>
<button id="addProduct">＋ 商品を登録</button><div id="productManage"></div>
</div></details></div>

<div class="card settingsCard"><details><summary>⚙️ 買う場所の登録・削除</summary><div class="settingsBody">
<h2>買う場所の管理</h2>
<label>新しい買う場所</label><input id="newStore" placeholder="例：魚屋"/>
<button id="addStore">＋ 買う場所を追加</button><div id="storeManage"></div>
<div class="small">買う場所を削除すると、その場所に登録した商品も削除します。すでに買い物リストへ追加した品は残ります。</div>
</div></details></div>
<div class="shoppingItemModal" hidden="" id="shoppingItemModal">
<div class="shoppingItemModalBox">
<div class="shoppingItemModalHeader">
<h2 id="shoppingModalTitle">商品</h2>
<button class="shoppingModalClose" id="shoppingModalClose" type="button">×</button>
</div>
<div class="shoppingPhotoPreviewWrap" hidden="" id="shoppingPhotoPreviewWrap">
<img alt="商品写真" id="shoppingPhotoPreview"/>
</div>
<label>商品写真</label>
<div class="productRegUpload"><label aria-label="写真を選択" class="productRegUploadLabel" for="shoppingPhotoInput" title="写真を選択">📷</label><input accept="image/*,.heic,.heif,.jpg,.jpeg,.png,.webp" id="shoppingPhotoInput" type="file"/><span class="small" style="margin:0">写真・ファイルから選択</span></div>
<div class="purchaseBox">
<label>今回の購入内容</label>
<div class="purchaseHint">今回の買い方を選んで入力してください。<b>gで計算</b>を選んだ時だけ重さ（g）を入力します。<b>商品単価</b>は商品単価×個数で計算します。</div>
<div id="purchaseRows"></div>
<button class="gray" id="addPurchaseRow" style="margin-top:8px" type="button">＋ 購入内容を追加</button>
<div class="purchaseTotal"><span>今回合計</span><strong id="purchaseTotalValue">¥0</strong></div>
<button class="gray" id="saveMasterUnitPrice" style="margin-top:8px" type="button">この単価を商品マスターに保存</button>
<div class="small">※ 特売など今回だけの価格は保存せず、通常の基準単価として残したい時だけ押してください。</div>
</div>
<label>商品名</label>
<input id="shoppingNameInput" type="text"/>
<label>数量・メモ</label>
<input id="shoppingMemoInput" placeholder="例：2袋 / 大サイズ" type="text"/>
<div class="shoppingModalActions">
<button class="gray" id="shoppingPhotoDelete" type="button">写真を削除</button>
<button id="shoppingItemSave" type="button">保存</button>
</div>
</div>
</div>
</div>
<script type="module">

import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {getDatabase,ref,onValue,push,remove,update} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

// ===== 新しいFirebase設定 =====
// 新しいFirebaseプロジェクトを作成したら、この3項目だけ差し替えます。
// 現在は動作確認用に、元のFirebase設定を仮に入れています。
const firebaseConfig = {
  apiKey: "AIzaSyA_vMCxwIC-0meq91ku_Jq60ArT6YEYutQ",
  authDomain: "kondo-fcbf8.firebaseapp.com",
  databaseURL: "https://kondo-fcbf8-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "kondo-fcbf8",
  storageBucket: "kondo-fcbf8.firebasestorage.app",
  messagingSenderId: "234082724756",
  appId: "1:234082724756:web:22f2a1fef8513fa0c7bd81"
};
const app=initializeApp(firebaseConfig), db=getDatabase(app);
const storesRef=ref(db,"stores"), productsRef=ref(db,"products"), itemsRef=ref(db,"items");

let stores={},products={},items={},filter="ALL";
const $=id=>document.getElementById(id);
function vals(o){return Object.entries(o||{})}
function storeName(id){return stores[id]?.name||itemsStoreName(id)||"その他"}
function findProductByItem(x){
 if(!x||!x.storeId)return null;
 if(x.productId && products[x.storeId]?.[x.productId]) return {id:x.productId,p:products[x.storeId][x.productId]};
 const found=vals(products[x.storeId]||{}).find(([,p])=>(p.name||"").trim()===(x.name||"").trim());
 return found?{id:found[0],p:found[1]}:null;
}
function productMasterForItem(x){const found=findProductByItem(x);return found?.p||{};}
function itemsStoreName(id){for(const [,x] of vals(items))if(x.storeId===id&&x.storeName)return x.storeName;return ""}
function renderSelectors(){
 const opts=vals(stores).sort((a,b)=>(a[1].name||"").localeCompare(b[1].name||"ja")).map(([id,s])=>`<option value="${id}">${esc(s.name)}</option>`).join("");
 const keep=$("storeSelect").value, keep2=$("regStore").value;
 $("storeSelect").innerHTML=opts;$("regStore").innerHTML=opts;
 if(stores[keep])$("storeSelect").value=keep;if(stores[keep2])$("regStore").value=keep2;
 renderProducts();
}
function normalizeProductSearch(s){
 const v=String(s??"").trim().toLowerCase();
 return v.replace(/[ァ-ヶ]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0x60))
         .replace(/[　 ]/g,"");
}
function renderProducts(){
 const sid=$("storeSelect").value;
 // 既に買い物リストに入っている（未購入の）商品は、選択肢から外して二重選択を防ぐ。
 const queuedProductIds=new Set(vals(items).filter(([,x])=>x.storeId===sid && !x.done && x.productId).map(([,x])=>x.productId));
 const ps=vals(products[sid]||{}).filter(([id])=>!queuedProductIds.has(id)).sort((a,b)=>(a[1].name||"").localeCompare(b[1].name||"ja"));

 const pickBox=$("productPickList");
 if(pickBox){
   pickBox.innerHTML=ps.length
     ? ps.map(([id,p])=>`<button type="button" class="productPickBtn" data-product-pick="${esc(id)}">＋ ${esc(p.name)}</button>`).join("")
     : `<div class="small" style="padding:4px 2px">商品がありません（下の設定から登録できます）</div>`;
   pickBox.querySelectorAll("[data-product-pick]").forEach(btn=>{
     btn.onclick=()=>addShoppingProductDirect(btn.dataset.productPick);
   });
 }
 renderProductManage();
}

// タップした商品を、数量1・メモ欄の現在値で即座に買い物リストへ追加する。数量は追加後、リスト側で変更する。
async function addShoppingProductDirect(pid){
 const sid=$("storeSelect").value;if(!sid)return alert("買う場所を選んでください");
 const product=products[sid]?.[pid];if(!product)return;
 const qty=1;
 const itemData={storeId:sid,storeName:stores[sid]?.name||"",name:product.name,memo:$("memo").value.trim(),quantity:qty,done:false,createdAt:Date.now(),productId:pid};
 const masterPrice=Number(product.price||0);
 const masterMode=product.priceMode||"pack";
 itemData.unitPrice=masterPrice;
 itemData.priceMode=masterMode;
 itemData.price=masterMode==="pack" ? Math.round(masterPrice*qty) : 0;
 if(product.photo)itemData.photo=product.photo;
 await push(itemsRef,itemData);
 $("memo").value="";
}

function renderStoreManage(){
 $("storeManage").innerHTML=vals(stores).sort((a,b)=>(a[1].name||"").localeCompare(b[1].name||"ja")).map(([id,s])=>`<div class="storeManage"><span>${esc(s.name)}</span><button class="danger" data-delstore="${id}">削除</button></div>`).join("");
 document.querySelectorAll("[data-delstore]").forEach(b=>b.onclick=async()=>{
   const id=b.dataset.delstore,name=stores[id]?.name||"";
   if(confirm(`「${name}」を削除しますか？\登録商品も削除されます。\買い物リストの品は残ります。`)){
     await remove(ref(db,"stores/"+id)); await remove(ref(db,"products/"+id));
   }
 });
}
function renderProductManage(){
 const sid=$("regStore").value;
 const list=vals(products[sid]||{});
 $("productManage").innerHTML=list.map(([id,p])=>{
   const photo=p.photo||"";
   const price=Number(p.price||0);
   return `<div class="storeManage productManageRow" style="display:grid;grid-template-columns:1fr 110px 1.2fr auto;gap:6px;align-items:center;margin:10px 0">
    <input type="text" value="${esc(p.name||"")}" data-pname="${id}" style="min-width:0;padding:9px;border:1px solid #ddd;border-radius:9px">
    <div><select data-pmode="${id}" style="width:100%;padding:9px;border:1px solid #ddd;border-radius:9px"><option value="pack" ${p.priceMode!=="gram"?"selected":""}>商品単価</option><option value="gram" ${p.priceMode==="gram"?"selected":""}>g単価</option></select><input type="number" min="0" step="0.01" inputmode="decimal" value="${price||""}" placeholder="価格" data-pprice="${id}" style="min-width:0;width:100%;padding:9px;border:1px solid #ddd;border-radius:9px;margin-top:4px"></div>
    <div class="productManagePhoto">${photo?`<img src="${esc(photo)}" alt="">`:`<div class="noPhoto">写真なし</div>`}<label class="photoIconButton" for="pphoto-${esc(id)}" title="写真を変更" aria-label="写真を変更">📷</label>${photo?`<button type="button" class="photoDeleteButton" data-delphoto="${esc(id)}" title="写真を削除" aria-label="写真を削除">🗑️</button>`:""}<input id="pphoto-${esc(id)}" type="file" accept="image/*,.heic,.heif,.jpg,.jpeg,.png,.webp" data-pphoto="${id}"></div>
    <button class="danger" data-delproduct="${id}">削除</button></div>`;
 }).join("");
 document.querySelectorAll("[data-delproduct]").forEach(b=>b.onclick=()=>remove(ref(db,`products/${sid}/${b.dataset.delproduct}`)));
 document.querySelectorAll("[data-pname]").forEach(i=>i.onchange=()=>{const v=i.value.trim();if(v)update(ref(db,`products/${sid}/${i.dataset.pname}`),{name:v})});
 document.querySelectorAll("[data-pprice]").forEach(i=>i.onchange=()=>update(ref(db,`products/${sid}/${i.dataset.pprice}`),{price:Math.max(0,Number(i.value)||0)}));
document.querySelectorAll("[data-pmode]").forEach(i=>i.onchange=()=>update(ref(db,`products/${sid}/${i.dataset.pmode}`),{priceMode:i.value}));
 document.querySelectorAll("[data-pphoto]").forEach(i=>i.onchange=async()=>{
   const file=i.files?.[0]; if(!file)return;
   try{const photo=await resizeShoppingPhoto(file); await update(ref(db,`products/${sid}/${i.dataset.pphoto}`),{photo}); renderProductManage();}
   catch(err){console.error(err);alert("写真の保存に失敗しました。");}
 });
 document.querySelectorAll("[data-delphoto]").forEach(b=>b.onclick=async()=>{
   if(!confirm("登録した写真を削除しますか？"))return;
   try{
     await update(ref(db,`products/${sid}/${b.dataset.delphoto}`),{photo:null});
     renderProductManage();
   }catch(err){console.error(err);alert("写真の削除に失敗しました。");}
 });
}
function updateShoppingAddView(){
 const card=$("shoppingAddCard"),title=$("shoppingAddTitle"),picker=$("shoppingAddStorePicker"),hint=$("selectedStoreHint");
 if(!card||!title||!picker||!hint)return;
 if(filter!=="ALL" && stores[filter]){
   title.textContent=`＋ ${stores[filter].name} に買う物を追加`;
   picker.style.display="none";
   hint.style.display="block";
   hint.className="small selectedStoreHint";
   hint.textContent=`買う場所：${stores[filter].name}`;
   $("storeSelect").value=filter;
 }else{
   title.textContent="買う物を追加";
   picker.style.display="block";
   hint.style.display="none";
 }
}
function openShoppingStore(id){
 filter=id;
 if(stores[id])$("storeSelect").value=id;
 renderProducts();
 renderList();
 renderFilters();
 updateShoppingAddView();
 const card=$("shoppingAddCard");
 if(card){
   const details=card.querySelector("details");
   if(details)details.open=true;
   requestAnimationFrame(()=>card.scrollIntoView({behavior:"smooth",block:"start"}));
 }
}
function renderFilters(){
 const counts={};
 // タグの数字は「登録商品数」ではなく、現在まだ買う必要がある未購入の買い物数を表示
 vals(items).forEach(([,x])=>{
   if(x.done)return;
   if(x.storeId)counts[x.storeId]=(counts[x.storeId]||0)+1;
 });
 const used=new Set(vals(items).map(([,x])=>x.storeId).filter(Boolean));
 const ids=[...new Set([...Object.keys(stores),...used])];
 const total=vals(items).filter(([,x])=>!x.done).length;
 $("filters").innerHTML=`<button data-f="ALL" class="${filter==="ALL"?"active":""} ${total?"has-items":""}">全部${total?` <span class="count">${total}</span>`:""}</button>`+
 ids.map(id=>`<button data-f="${id}" class="${filter===id?"active":""} ${counts[id]?"has-items":""}">${esc(storeName(id))}${counts[id]?` <span class="count">${counts[id]}</span>`:""}</button>`).join("");
 document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{
   const id=b.dataset.f;
   // 買う場所タグは「表示の切り替え」だけ。追加画面へは移動しない。
   filter=id;
   if(id!=="ALL" && stores[id])$("storeSelect").value=id;
   renderProducts();
   renderList();
   renderFilters();
   updateShoppingAddView();
 });
 updateShoppingAddView();
}

let editingItemId=null;
let shoppingModalItemId=null;
let shoppingPendingPhoto=null;
let shoppingPurchases=[];


function yen(v){
const n=Number(v||0);
return "¥"+Math.round(n).toLocaleString("ja-JP");
}

function renderShoppingTotals(){}
function renderStoreQuickAddButton(){
 const list=$("list");
 if(!list)return;
 const old=$("storeQuickAddButton"); if(old)old.remove();
 const oldReg=$("storeQuickRegisterButton"); if(oldReg)oldReg.remove();
 if(filter==="ALL"||!stores[filter])return;
 const btn=document.createElement("button");
 btn.type="button";btn.id="storeQuickAddButton";btn.className="storeQuickAddButton";
 btn.textContent=`＋ ${stores[filter].name} に買う物を追加`;
 btn.onclick=()=>{const card=$("shoppingAddCard");if(!card)return;const details=card.querySelector("details");if(details)details.open=true;card.scrollIntoView({behavior:"smooth",block:"start"});};
 list.parentNode.insertBefore(btn,list);
 const regBtn=document.createElement("button");
 regBtn.type="button";regBtn.id="storeQuickRegisterButton";regBtn.className="storeQuickAddButton storeQuickRegisterButton";
 regBtn.textContent=`🏷️ ${stores[filter].name} の商品を登録`;
 regBtn.onclick=()=>{
   const card=$("productAddCard");if(!card)return;
   const details=card.querySelector("details");if(details)details.open=true;
   const reg=$("regStore");if(reg){reg.value=filter;renderProductManage();}
   card.scrollIntoView({behavior:"smooth",block:"start"});
 };
 list.parentNode.insertBefore(regBtn,list);
}


function renderList(){
const arr=vals(items).map(([id,x])=>({id,...x})).filter(x=>filter==="ALL"||x.storeId===filter);
if(!arr.length){$("list").innerHTML='<div class="empty">買う物はまだありません。</div>';renderStoreQuickAddButton();renderShoppingTotals();return}
const groups={};arr.forEach(x=>{const k=x.storeId||"OTHER";if(!groups[k])groups[k]=[];groups[k].push(x);});
$("list").innerHTML=Object.entries(groups).map(([sid,a])=>{
const storeTotal=a.reduce((sum,x)=>sum+Number(x.price||0),0);
return `<section class="storeGroup"><div class="storeTitle"><span>${esc(a[0].storeName||storeName(sid))}</span><span class="storeTotal">買物合計 ${yen(storeTotal)}</span></div>${a.map(x=>{
const price=Number(x.price||0);
const photo=x.photo||"";
const purchaseQty=Array.isArray(x.purchaseDetails)&&x.purchaseDetails.length
  ? x.purchaseDetails.reduce((sum,r)=>sum+Math.max(0,Number(r.qty)||0),0)
  : Math.max(0,Number(x.quantity)||0);
const qtyText=purchaseQty>0 ? `数量 ${purchaseQty}` : (x.memo||"");
if(editingItemId===x.id){
return `<div class="item"><input type="checkbox" ${x.done?"checked":""} data-check="${x.id}"><div class="itemText" style="display:block"><input type="text" value="${esc(x.name)}" data-editname="${x.id}" style="width:100%;margin-bottom:6px;padding:8px;border-radius:8px;border:1px solid #ccc;font-size:16px"><input type="text" value="${esc(x.memo||"")}" placeholder="数量・メモ" data-editmemo="${x.id}" style="width:100%;padding:8px;border-radius:8px;border:1px solid #ccc;font-size:16px"></div><button class="itemDelete" data-editsave="${x.id}" style="background:#3269df;color:#fff">保存</button></div>`;
}
return `<div class="item ${x.done?"done":""}"><input type="checkbox" ${x.done?"checked":""} data-check="${x.id}"><div class="itemText"><div class="itemProductLine"><span class="itemProductName"><b>${esc(x.name)}</b></span><button type="button" class="shoppingTapIcon" data-edit="${x.id}" title="写真・価格を登録・編集" aria-label="写真・価格を登録・編集">🔍</button></div>${qtyText?`<div class="small itemQuantity">${esc(qtyText)}</div>`:""}${price>0?`<div class="itemPrice">${yen(price)}</div>`:""}</div><button class="itemDelete" data-delitem="${x.id}">削除</button></div>`;
}).join("")}</section>`;
}).join("");
document.querySelectorAll("[data-check]").forEach(c=>c.onchange=()=>update(ref(db,"items/"+c.dataset.check),{done:c.checked}));
document.querySelectorAll("[data-delitem]").forEach(b=>b.onclick=()=>remove(ref(db,"items/"+b.dataset.delitem)));
document.querySelectorAll("[data-edit]").forEach(d=>d.onclick=()=>openShoppingItemModal(d.dataset.edit));
document.querySelectorAll("[data-editsave]").forEach(b=>b.onclick=async()=>{
const id=b.dataset.editsave;
const nameInput=document.querySelector(`[data-editname="${id}"]`),memoInput=document.querySelector(`[data-editmemo="${id}"]`);
const name=nameInput.value.trim(),memo=memoInput.value.trim();
if(!name)return alert("商品名を入力してください");
await update(ref(db,"items/"+id),{name,memo});
editingItemId=null;
renderList();
});
renderStoreQuickAddButton();
renderShoppingTotals();
}

function openShoppingItemModal(id){
const x=items[id];
if(!x)return;
shoppingModalItemId=id;
const master=productMasterForItem(x);
shoppingPendingPhoto=x.photo||master.photo||null;
const defaultMode=master.priceMode||x.priceMode||"pack";
if(Array.isArray(x.purchaseDetails)&&x.purchaseDetails.length){
 shoppingPurchases=x.purchaseDetails.map(r=>{
   const mode=r.mode||defaultMode;
   const legacy=r.unitPrice??r.packPrice??"";
   return {mode,grams:r.grams??"",gramPrice:r.gramPrice??(mode==="gram"?legacy:""),packPrice:r.packPrice??(mode==="pack"?legacy:""),qty:r.qty??1};
 });
}else{
 const masterPrice=master.price??x.price??"";
 shoppingPurchases=[{mode:defaultMode,grams:"",gramPrice:defaultMode==="gram"?masterPrice:"",packPrice:defaultMode==="pack"?masterPrice:"",qty:Math.max(1,Number(x.quantity)||1)}];
}
$("shoppingModalTitle").textContent=x.name||"商品";
$("shoppingNameInput").value=x.name||"";
$("shoppingMemoInput").value=x.memo||"";
$("shoppingPhotoInput").value="";
renderShoppingPhotoPreview(shoppingPendingPhoto);
renderPurchaseRows();
$("shoppingItemModal").hidden=false;
document.body.style.overflow="hidden";
}
function renderPurchaseRows(){
 const box=$("purchaseRows"); if(!box)return;
 box.innerHTML=shoppingPurchases.map((r,i)=>{
   const mode=r.mode||"pack";
   const unitLabel=mode==="gram"?"g単価（円/g）":"商品単価（円）";
   const currentPrice=mode==="gram"?(r.gramPrice??""):(r.packPrice??"");
   const pricePlaceholder=mode==="gram"?"例：1.75":"例：175";
   return `<div class="purchaseRow">
    <div class="purchaseMode"><button type="button" class="${mode==="gram"?"active":""}" data-pmode="gram" data-pi="${i}">⚖️ gで計算</button><button type="button" class="${mode==="pack"?"active":""}" data-pmode="pack" data-pi="${i}">💰 商品単価</button></div>
    ${mode==="gram"?`<div class="purchaseField"><label>重さ（g）</label><input type="number" min="0" step="0.01" inputmode="decimal" enterkeyhint="next" placeholder="例：235" value="${esc(r.grams)}" data-pg="${i}"></div>`:""}
    <div class="purchaseField"><label>${unitLabel}</label><input type="number" min="0" step="0.01" inputmode="decimal" enterkeyhint="done" placeholder="${pricePlaceholder}" value="${esc(currentPrice)}" data-pp="${i}"></div>
    <div class="purchaseQtyWrap"><span class="purchaseQtyLabel">個数</span><button type="button" class="gray purchaseQtyBtn" data-qminus="${i}">−</button><input class="purchaseQtyValue" type="number" min="1" step="1" inputmode="numeric" value="${esc(r.qty||1)}" data-pq="${i}"><button type="button" class="purchaseQtyBtn" data-qplus="${i}">＋</button><button type="button" class="gray purchaseRemove" data-pr="${i}" title="この購入内容を削除">🗑️</button></div>
    <div class="purchaseCalcNote">${mode==="gram"?"計算：重さ × g単価 × 個数":"計算：商品単価 × 個数"}</div>
   </div>`;
 }).join("");
 box.querySelectorAll("[data-pmode]").forEach(e=>e.onclick=()=>{
   const r=shoppingPurchases[+e.dataset.pi];
   r.mode=e.dataset.pmode;
   renderPurchaseRows();
 });
 box.querySelectorAll("[data-pg]").forEach(e=>e.oninput=()=>{shoppingPurchases[+e.dataset.pg].grams=e.value;updatePurchaseTotal()});
 box.querySelectorAll("[data-pp]").forEach(e=>e.oninput=()=>{
   const r=shoppingPurchases[+e.dataset.pp];
   if(r.mode==="gram") r.gramPrice=e.value; else r.packPrice=e.value;
   updatePurchaseTotal();
 });
 box.querySelectorAll("[data-pq]").forEach(e=>e.oninput=()=>{shoppingPurchases[+e.dataset.pq].qty=Math.max(1,Number(e.value)||1);e.value=shoppingPurchases[+e.dataset.pq].qty;updatePurchaseTotal()});
 box.querySelectorAll("[data-qminus]").forEach(e=>e.onclick=()=>{const i=+e.dataset.qminus;shoppingPurchases[i].qty=Math.max(1,(Number(shoppingPurchases[i].qty)||1)-1);renderPurchaseRows()});
 box.querySelectorAll("[data-qplus]").forEach(e=>e.onclick=()=>{const i=+e.dataset.qplus;shoppingPurchases[i].qty=(Number(shoppingPurchases[i].qty)||1)+1;renderPurchaseRows()});
 box.querySelectorAll("[data-pr]").forEach(e=>e.onclick=()=>{if(shoppingPurchases.length===1)shoppingPurchases[0]={mode:"pack",grams:"",gramPrice:"",packPrice:"",qty:1};else shoppingPurchases.splice(+e.dataset.pr,1);renderPurchaseRows()});
 updatePurchaseTotal();
}
function updatePurchaseTotal(){const total=shoppingPurchases.reduce((sum,r)=>{const qty=Math.max(1,Number(r.qty)||1),p=Math.max(0,Number(r.mode==="gram"?r.gramPrice:r.packPrice)||0),g=Math.max(0,Number(r.grams)||0);return sum+(r.mode==="gram"?g*p*qty:p*qty)},0);$("purchaseTotalValue").textContent=yen(total);return total;}

function closeShoppingItemModal(){
$("shoppingItemModal").hidden=true;
document.body.style.overflow="";
shoppingModalItemId=null;
shoppingPendingPhoto=null;
shoppingPurchases=[];
}

function renderShoppingPhotoPreview(src){
const wrap=$("shoppingPhotoPreviewWrap"),img=$("shoppingPhotoPreview");
if(src){img.src=src;wrap.hidden=false;}else{img.removeAttribute("src");wrap.hidden=true;}
}

async function resizeShoppingPhoto(file){
const dataUrl=await new Promise((resolve,reject)=>{
const reader=new FileReader();
reader.onload=()=>resolve(reader.result);
reader.onerror=reject;
reader.readAsDataURL(file);
});
const img=await new Promise((resolve,reject)=>{
const im=new Image();
im.onload=()=>resolve(im);
im.onerror=reject;
im.src=dataUrl;
});
const max=900;
const scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
const canvas=document.createElement("canvas");
canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));
canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
return canvas.toDataURL("image/jpeg",0.72);
}

$("shoppingModalClose").onclick=closeShoppingItemModal;
$("shoppingItemModal").addEventListener("click",e=>{if(e.target===$("shoppingItemModal"))closeShoppingItemModal();});
$("shoppingPhotoInput").addEventListener("change",async e=>{
const file=e.target.files?.[0];
if(!file)return;
try{
shoppingPendingPhoto=await resizeShoppingPhoto(file);
renderShoppingPhotoPreview(shoppingPendingPhoto);
}catch(err){
console.error(err);
alert("写真の読み込みに失敗しました。");
}
});
$("addPurchaseRow").onclick=()=>{shoppingPurchases.push({mode:shoppingPurchases[0]?.mode||"pack",grams:"",gramPrice:"",packPrice:"",qty:1});renderPurchaseRows()};

$("shoppingPhotoDelete").onclick=()=>{
shoppingPendingPhoto=null;
$("shoppingPhotoInput").value="";
renderShoppingPhotoPreview(null);
};
$("saveMasterUnitPrice").onclick=async()=>{
 const id=shoppingModalItemId;
 const x=id?items[id]:null;
 if(!x)return;
 const name=$("shoppingNameInput").value.trim();
 const found=findProductByItem({...x,name});
 if(!found)return alert("商品マスターに登録された商品ではありません。");
 const r=shoppingPurchases[0];
 if(!r)return alert("購入内容がありません。");
 const mode=r.mode||"pack";
 const unitPrice=mode==="gram"?Number(r.gramPrice)||0:Number(r.packPrice)||0;
 if(unitPrice<=0)return alert("保存する単価を入力してください。");
 const total=updatePurchaseTotal();
 const qty=shoppingPurchases.reduce((sum,p)=>sum+Math.max(1,Number(p.qty)||1),0);
 if(!confirm(`商品マスターの${mode==="gram"?"g単価":"商品単価"}を ${unitPrice} に更新し、今回の買物にも反映しますか？`))return;
 try{
   await update(ref(db,`products/${x.storeId}/${found.id}`),{price:unitPrice,priceMode:mode});
   await update(ref(db,"items/"+id),{price:total,quantity:qty,priceMode:mode,unitPrice});
   alert("商品単価を保存し、買物リストにも反映しました。");
   closeShoppingItemModal();
 }catch(err){
   console.error(err);
   alert("単価の保存に失敗しました。");
 }
};
$("shoppingItemSave").onclick=async()=>{
const id=shoppingModalItemId;
if(!id||!items[id])return;
const name=$("shoppingNameInput").value.trim();
const memo=$("shoppingMemoInput").value.trim();
const price=updatePurchaseTotal();
if(!name)return alert("商品名を入力してください");
try{
 const current=items[id]||{};
 const found=findProductByItem({...current,name});
 const purchaseDetails=shoppingPurchases.filter(r=>Number(r.mode==="gram"?r.gramPrice:r.packPrice)>0).map(r=>{
   const mode=r.mode||"pack";
   const gp=Math.max(0,Number(r.gramPrice)||0);
   const pp=Math.max(0,Number(r.packPrice)||0);
   return {mode,grams:Math.max(0,Number(r.grams)||0),gramPrice:gp,packPrice:pp,unitPrice:mode==="gram"?gp:pp,qty:Math.max(1,Number(r.qty)||1)};
 });
 const totalQty=purchaseDetails.reduce((sum,r)=>sum+Math.max(1,Number(r.qty)||1),0);
 const first=shoppingPurchases[0]||{};
 const firstMode=first.mode||"pack";
 const firstUnitPrice=firstMode==="gram"?Math.max(0,Number(first.gramPrice)||0):Math.max(0,Number(first.packPrice)||0);
 const itemPatch={name,memo,price,quantity:totalQty,photo:shoppingPendingPhoto||null,purchaseDetails,unitPrice:firstUnitPrice,priceMode:firstMode};
 if(found){
   itemPatch.productId=found.id;
   await update(ref(db,`products/${current.storeId}/${found.id}`),{photo:shoppingPendingPhoto||null});
 }
 await update(ref(db,"items/"+id),itemPatch);
 closeShoppingItemModal();
}catch(err){
console.error(err);
alert("保存に失敗しました。");
}
};

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}

onValue(storesRef,s=>{stores=s.val()||{};renderSelectors();renderStoreManage();renderFilters()});
onValue(productsRef,s=>{products=s.val()||{};renderProducts()});
let masterMigrationDone=false;
async function migrateShoppingPricePhotoMasters(){
 if(masterMigrationDone)return;
 masterMigrationDone=true;
 for(const [,x] of vals(items)){
   const found=findProductByItem(x);
   if(!found)continue;
   const patch={};
   if(x.photo && !found.p.photo)patch.photo=x.photo;
   if(x.price!==undefined && found.p.price===undefined)patch.price=Number(x.price)||0;
   if(Object.keys(patch).length)await update(ref(db,`products/${x.storeId}/${found.id}`),patch);
 }
}
onValue(itemsRef,s=>{items=s.val()||{};renderList();renderFilters();renderProducts();updateShoppingBadge();renderShoppingTotals();migrateShoppingPricePhotoMasters()});

 const remaining=vals(items).filter(([,x])=>!x.done).length;
 const tab=$("tabShopping");
 if(tab)tab.innerHTML=`🛒 買い物${remaining?` <span class="count">${remaining}</span>`:""}`;
}

$("addProduct").onclick=async()=>{
 const sid=$("regStore").value,name=$("newProduct").value.trim();

 $("newProduct").value="";$("newProductPrice").value="";$("newProductPriceMode").value="pack";$("newProductPhoto").value="";
 $("newProductPhotoPreview").hidden=true;
 // 登録した場所を「買う物を追加」側にも反映し、タップ用の選択肢をすぐ更新する。

 renderProducts();

$("addItem").onclick=async()=>{
 const sid=$("storeSelect").value;if(!sid)return alert("買う場所を選んでください");

 if(!free)return alert("商品名を入力するか、上の商品ボタンをタップしてください");

 await push(itemsRef,itemData);
 $("freeProduct").value="";$("memo").value="";
};

$("uncheckAll").onclick=async()=>{for(const [id,x] of vals(items))if(x.done)await update(ref(db,"items/"+id),{done:false})};
